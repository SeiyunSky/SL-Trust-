# SLTrust-DFL MVP 验证配置

experiment:
  name: "sltrust_dfl_mvp"
  seed: 42
  device: "cuda"

federated:
  num_clients: 10
  byzantine_ratio: 0.2       # 2个拜占庭节点
  num_rounds: 100
  local_epochs: 1
  batch_size: 128

data:
  dataset: "mnist"
  data_dir: "./data"
  non_iid_alpha: 0.2         # 适中 Non-IID

topology:
  type: "mesh"
  degree: 4

optimizer:
  lr: 0.01

# 各方法超参
fedavg:
  alpha: 0.5

sama:
  alpha: 0.5

contra:
  alpha: 0.5
  beta: 0.1

sltrust:
  alpha: 0.5
  beta: 0.1
  S: 3
  L: 10

krum:
  alpha: 0.5
  byzantine_ratio: 0.2

trimmed_mean:
  alpha: 0.5
  trim_ratio: 0.1

balance:
  alpha: 0.5
  gamma: 0.5
  kappa: 0.1

# 攻击超参
attack:
  sign_flip:
    scale: 1.0
  gaussian:
    std: 5.0
  burn_in:
    warmup_rounds: 40         # 前40轮诚实，后60轮SF
    scale: 1.0
  oscillating:
    period_attack: 10
    period_rest: 15
    scale: 1.0
  alie: {}                    # 自动由 num_clients / byzantine_ratio 推导
  slow_poison:
    scale: 0.1
  backdoor:
    lambda_bd: 0.3

logging:
  log_interval: 5
  save_dir: "./results"
