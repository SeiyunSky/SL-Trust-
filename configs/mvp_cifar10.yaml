# SLTrust-DFL MVP 验证配置 — CIFAR-10

experiment:
  name: "sltrust_dfl_mvp_cifar10"
  seed: 42
  device: "cuda"

federated:
  num_clients: 10
  byzantine_ratio: 0.2
  num_rounds: 100
  local_epochs: 1
  batch_size: 128

data:
  dataset: "cifar10"
  data_dir: "./data"
  non_iid_alpha: 0.2
  augmentation: standard
  num_workers: 4

model:
  name: resnet18_cifar_bn

topology:
  type: "mesh"
  degree: 4

optimizer:
  name: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  scheduler: cosine

fedavg:
  alpha: 0.5

sama:
  alpha: 0.5

contra:
  alpha: 0.5
  beta: 0.1

sltrust:
  alpha: 0.5
  beta: 0.1
  S: 3
  L: 10

krum:
  alpha: 0.5
  byzantine_ratio: 0.2

trimmed_mean:
  alpha: 0.5
  trim_ratio: 0.1

balance:
  alpha: 0.5
  gamma: 0.5
  kappa: 0.1

attack:
  sign_flip:
    scale: 1.0
  gaussian:
    std: 5.0
  burn_in:
    warmup_rounds: 40
    scale: 1.0
  oscillating:
    period_attack: 10
    period_rest: 15
    scale: 1.0
  alie: {}
  slow_poison:
    scale: 0.1
  backdoor:
    lambda_bd: 0.3

logging:
  log_interval: 5
  save_dir: "./results"
