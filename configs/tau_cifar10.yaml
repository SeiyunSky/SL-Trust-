# SLTrust-DFL τ 演化实验配置 — CIFAR-10
# 只跑 contra + sltrust，log_interval=1

experiment:
  name: "sltrust_dfl_tau_cifar10"
  seed: 42
  device: "cuda"

federated:
  num_clients: 20
  byzantine_ratio: 0.2
  num_rounds: 200
  local_epochs: 3
  batch_size: 128

data:
  dataset: "cifar10"
  data_dir: "./data"
  non_iid_alpha: 0.2

topology:
  type: "mesh"
  degree: 4

optimizer:
  lr: 0.01

contra:
  alpha: 0.5
  beta: 0.1

sltrust:
  alpha: 0.5
  beta: 0.1
  S: 3
  L: 10

attack:
  sign_flip:
    scale: 1.0
  gaussian:
    std: 5.0
  burn_in:
    warmup_rounds: 40
    scale: 1.0
  oscillating:
    period_attack: 10
    period_rest: 15
    scale: 1.0
  slow_poison:
    scale: 0.1
  backdoor:
    lambda_bd: 0.3

logging:
  log_interval: 1
  save_dir: "./results"
