# SLTrust-DFL 消融实验配置 — CIFAR-10

experiment:
  name: "sltrust_dfl_ablation_cifar10"
  seed: 42
  device: "cuda"

federated:
  num_clients: 20
  byzantine_ratio: 0.2
  num_rounds: 200
  local_epochs: 3
  batch_size: 128

data:
  dataset: "cifar10"
  data_dir: "./data"
  non_iid_alpha: 0.2
  augmentation: standard
  num_workers: 4

model:
  name: resnet18_cifar_bn

topology:
  type: "mesh"
  degree: 4

optimizer:
  name: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  scheduler: cosine

sltrust:
  alpha: 0.5
  beta: 0.1
  S: 3
  L: 10

sltrust_no_ratio:
  alpha: 0.5
  beta: 0.1
  S: 3
  L: 10

sltrust_short_only:
  alpha: 0.5
  beta: 0.1
  S: 3
  L: 10

sltrust_long_only:
  alpha: 0.5
  beta: 0.1
  S: 3
  L: 10

attack:
  burn_in:
    warmup_rounds: 40
    scale: 1.0
  oscillating:
    period_attack: 10
    period_rest: 15
    scale: 1.0

logging:
  log_interval: 5
  save_dir: "./results"
