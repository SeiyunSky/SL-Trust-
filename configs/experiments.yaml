# The only experiment configuration file. Select one entry under presets by name.

defaults:
  experiment:
    name: sltrust_dfl
    seed: 42
    device: cuda
  federated:
    num_clients: 20
    byzantine_ratio: 0.2
    num_rounds: 100
    local_epochs: 1
    batch_size: 128
  data:
    dataset: mnist
    data_dir: ./data
    non_iid_alpha: 0.1
    num_workers: 0
  model:
    name: simple_cnn
  topology:
    type: mesh
    degree: 6
  optimizer:
    name: sgd
    lr: 0.01
    momentum: 0.0
    weight_decay: 0.0
    scheduler: none
  logging:
    log_interval: 5
    save_dir: ./results

method_params:
  fedavg: {alpha: 0.5}
  sama: {alpha: 0.5}
  contra: {alpha: 0.5, beta: 0.1}
  contra_hard: {alpha: 0.5, beta: 0.1, threshold: 0.1}
  sltrust: {alpha: 0.5, beta: 0.1, S: 3, L: 10}
  sltrust_no_ratio: {alpha: 0.5, beta: 0.1, S: 3, L: 10}
  sltrust_no_clip: {alpha: 0.5, beta: 0.1, S: 3, L: 10}
  sltrust_adaptive: {alpha: 0.5, beta: 0.1, S: 3, L: 10}
  sltrust_median: {alpha: 0.5, beta: 0.1, S: 3, L: 10}

attack_params:
  none: {}
  gaussian: {std: 10.0}
  broken_node: {}
  burn_in: {warmup_rounds: 40, std: 10.0}
  oscillating: {warmup_rounds: 30, period_attack: 10, period_rest: 20, std: 10.0}
  gradual_gaussian: {warmup_rounds: 40, ramp_rounds: 20, std: 10.0}

presets:
  main_table_mnist:
    experiment: {name: sltrust_dfl_main_table_mnist}

  main_table_cifar10:
    experiment: {name: sltrust_dfl_main_table_cifar10}
    federated: {num_rounds: 200, local_epochs: 3}
    data: {dataset: cifar10, non_iid_alpha: 0.5, augmentation: standard, num_workers: 4}
    model: {name: resnet18_cifar_bn}
    optimizer: {lr: 0.1, momentum: 0.9, weight_decay: 0.0005, scheduler: cosine}

  ablation_mnist:
    experiment: {name: sltrust_dfl_ablation_mnist}

  ablation_cifar10:
    experiment: {name: sltrust_dfl_ablation_cifar10}
    federated: {num_rounds: 200, local_epochs: 3}
    data: {dataset: cifar10, non_iid_alpha: 0.5, augmentation: standard, num_workers: 4}
    model: {name: resnet18_cifar_bn}
    optimizer: {lr: 0.1, momentum: 0.9, weight_decay: 0.0005, scheduler: cosine}

  tau_mnist:
    experiment: {name: sltrust_dfl_tau_mnist}

  tau_cifar10:
    experiment: {name: sltrust_dfl_tau_cifar10}
    federated: {num_rounds: 200, local_epochs: 3}
    data: {dataset: cifar10, non_iid_alpha: 0.5, augmentation: standard, num_workers: 4}
    model: {name: resnet18_cifar_bn}
    optimizer: {lr: 0.1, momentum: 0.9, weight_decay: 0.0005, scheduler: cosine}

  sensitivity_mnist:
    experiment: {name: sltrust_dfl_sensitivity_mnist}
    sensitivity:
      methods: [contra, sltrust]
      seeds: [42]
      burnin_warmups: [0, 20, 40, 60]
      oscillating_periods: [5, 10, 20]
      alpha_values: [0.3, 0.5, 0.7]
