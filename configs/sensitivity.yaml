# SLTrust-DFL 参数敏感性实验配置
# Burn-in warmup 扫描 + Oscillating period 扫描
# 只跑 contra + sltrust

experiment:
  name: "sltrust_dfl_sensitivity"
  seed: 42
  device: "cuda"

federated:
  num_clients: 20
  byzantine_ratio: 0.2
  num_rounds: 100
  local_epochs: 1
  batch_size: 128

data:
  dataset: "mnist"
  data_dir: "./data"
  non_iid_alpha: 0.5

topology:
  type: "mesh"
  degree: 4

optimizer:
  lr: 0.01

contra:
  alpha: 0.5
  beta: 0.1

sltrust:
  alpha: 0.5
  beta: 0.1
  S: 3
  L: 10

attack:
  sign_flip:
    scale: 1.0
  burn_in:
    warmup_rounds: 40
    scale: 1.0
  oscillating:
    period_attack: 10
    period_rest: 15
    scale: 1.0

logging:
  log_interval: 5
  save_dir: "./results"
